<script src="assets/js/data-manfred.js"></script>
<script>
(function () {
  "use strict";
  const M = window.MANFRED;
  const NUMS = ["一", "二", "三", "四"];
  const $ = (s) => document.querySelector(s);

  /* 卷首 */
  $("#epigraph").innerHTML = M.epigraph.filter(l => l !== "").join("<br>");
  $("#persons").innerHTML = M.persons.map(p => "<li>" + p + "</li>").join("");
  $("#setting").textContent = M.setting;

  /* 目次 */
  const toc = $("#toc");
  M.acts.forEach(a => {
    const al = document.createElement("a");
    al.href = "#act-" + a.n;
    al.className = "act-link";
    al.textContent = "第" + NUMS[a.n - 1] + "幕";
    toc.appendChild(al);
    a.scenes.forEach(s => {
      const sl = document.createElement("a");
      sl.href = "#act-" + a.n + "-scene-" + s.n;
      sl.className = "sc-link";
      sl.textContent = "第" + NUMS[s.n - 1] + "场";
      toc.appendChild(sl);
    });
  });

  /* 正文 */
  const play = $("#play");
  const frag = document.createDocumentFragment();
  M.acts.forEach(a => {
    const block = document.createElement("section");
    block.className = "act-block";
    block.id = "act-" + a.n;
    const banner = document.createElement("div");
    banner.className = "act-banner";
    banner.innerHTML = '<span class="mark">ACT ' + ["I", "II", "III"][a.n - 1] + '</span><h2>第' + NUMS[a.n - 1] + '幕</h2>';
    block.appendChild(banner);
    a.scenes.forEach(s => {
      const sb = document.createElement("section");
      sb.className = "scene-block";
      sb.id = "act-" + a.n + "-scene-" + s.n;
      const head = document.createElement("div");
      head.className = "scene-head";
      head.innerHTML = '<span class="no">第' + NUMS[s.n - 1] + '场</span><span class="place">' + (s.place || "") + "</span>";
      sb.appendChild(head);
      s.content.forEach(item => {
        if (item.t === "direction") {
          const d = document.createElement("div");
          d.className = "direction";
          d.textContent = item.text;
          sb.appendChild(d);
        } else {
          const sp = document.createElement("div");
          sp.className = "speech";
          const who = document.createElement("div");
          who.className = "who";
          who.textContent = item.who;
          sp.appendChild(who);
          const verse = document.createElement("div");
          verse.className = "verse";
          verse.innerHTML = item.lines.map(l => '<span class="ln">' + l + "</span>").join("");
          sp.appendChild(verse);
          sb.appendChild(sp);
        }
      });
      block.appendChild(sb);
    });
    frag.appendChild(block);
  });
  play.appendChild(frag);

  /* 注释 */
  $("#notes-list").innerHTML = M.notes.map(n => {
    const m = n.match(/^\[(\d+|\*)\]/);
    const mk = m ? m[1] : "※";
    const body = n.replace(/^\[(\d+|\*)\]\s*/, "");
    return '<li><span class="mk">[' + mk + ']</span>' + body + "</li>";
  }).join("");

  /* 油灯：回到顶部 */
  const lamp = document.getElementById("lamp-widget");
  lamp.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  /* 联动目录：滚动时在目次中标注当前读到的幕/场 */
  const sections = [...play.querySelectorAll(".act-block, .scene-block")];
  const linkById = {};
  toc.querySelectorAll("a").forEach(a => { linkById[a.getAttribute("href").slice(1)] = a; });
  let curId = null;
  function mark(id) {
    Object.values(linkById).forEach(a => a.classList.remove("cur", "cur-act"));
    if (!id) return;
    const a = linkById[id];
    if (a) a.classList.add("cur");
    const m = id.match(/^(act-\d+)-scene-\d+$/);
    if (m && linkById[m[1]]) linkById[m[1]].classList.add("cur-act");
  }
  function spy() {
    const probe = window.innerHeight * 0.28;
    let active = null;
    for (const s of sections) {
      if (s.getBoundingClientRect().top <= probe) active = s.id;
      else break;
    }
    if (active !== curId) { curId = active; mark(active); }
  }
  toc.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    curId = a.getAttribute("href").slice(1);
    mark(curId); /* 立即反馈；平滑滚动结束后 spy 会校准 */
  });
  let spyLast = 0;
  window.addEventListener("scroll", () => {
    const now = performance.now();
    if (now - spyLast < 80) return;
    spyLast = now;
    spy(); /* 同步执行，不依赖 rAF（后台/节流环境亦可靠） */
  }, { passive: true });
  window.addEventListener("resize", spy);
  setInterval(spy, 400); /* 兜底：滚动恢复、锚点跳转、事件被节流的环境 */
  spy();
})();
</script>
</body>
</html>
